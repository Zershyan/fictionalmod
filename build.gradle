buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        classpath 'com.guardsquare:proguard-gradle:7.7.0'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory(file('run'))

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        var client = client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
        }

        client_0 {
            parent(client)
            args("--username", "player_0")
        }

        client_1 {
            parent(client)
            args("--username", "player_1")
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory(file('run-data'))
            property('gradle.task', 'runData')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        dir 'libs'
    }
    maven { // TOP
        url "https://cursemaven.com"
    }
    maven { //mirror
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

jarJar.enable()

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    //dependencies
    compileOnly("org.spongepowered:mixin:0.8.5")
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1") {
        jarJar.ranged(it, "[0.4.1,)")
    })

    //饰品
    compileOnly fg.deobf("curse.maven:curios-309927:6418456")
    //维度网络
    compileOnly fg.deobf("curse.maven:beyond-dimensions-1222890:8142917")
    compileOnly fg.deobf("maven.modrinth:pbyxka1h:Y2iX7gMO")
    //夸克
//    implementation fg.deobf("curse.maven:quark-243121:5594847")
//    implementation fg.deobf("curse.maven:zeta-968868:5597406")
    //锦致装饰
//    implementation fg.deobf("curse.maven:selene-499980:5938277")
//    implementation fg.deobf("curse.maven:supplementaries-412082:5458843")
    //诡厄巫法
    compileOnly fg.deobf("curse.maven:goety-586095:7888176")
    compileOnly fg.deobf("blank:goety-awaken-1.20.1:1.3.8")
    //冠军/强敌
    compileOnly fg.deobf("curse.maven:champions-unofficial-1074990:5893428")
    //gecko lib
    compileOnly fg.deobf("curse.maven:geckolib-388172:7553267")
    //天境 + 新生代
    compileOnly fg.deobf("curse.maven:aether-255308:6134920")
    compileOnly fg.deobf("curse.maven:aether-redux-867237:5872671")
    //天境内置前置
    compileOnly fg.deobf("blank:nitrogen_internals-1.20.1:1.0.12")
    //aero blender
    compileOnly fg.deobf("blank:aeroblender-1.20.1:1.0.2-rc1")
    //terra blender
    compileOnly fg.deobf("curse.maven:terrablender-563928:6290448")
    //战斗高塔
    compileOnly fg.deobf("blank:babt-1.20.1:3.0.0-beta3.2.1")
    //灾变
    compileOnly fg.deobf("curse.maven:lionfish-api-1001614:5922047")
    compileOnly fg.deobf("curse.maven:lendercataclysm-551586:6906993")
    //锦致装饰
//    compileOnly fg.deobf("curse.maven:selene-499980:5938277")
//    compileOnly fg.deobf("curse.maven:supplementaries-412082:5458843")
    //lootr
    compileOnly fg.deobf("curse.maven:lootr-361276:7263076")
    //突变生物
    compileOnly fg.deobf("curse.maven:mutant-monsters-852665:5107399")
    compileOnly fg.deobf("curse.maven:puzzles-lib-495476:6918565")
    //更多突变生物
    compileOnly fg.deobf("blank:mutantmore-1.20.1:1.0.0")
    //传奇怪物
    compileOnly fg.deobf("curse.maven:legendary-monsters-944035:8170235")
    //神明吞噬者
//    compileOnly fg.deobf("curse.maven:dog-1630975:8549326")

    runtimeOnly fg.deobf("curse.maven:jade-324717:6855440")
    implementation fg.deobf("curse.maven:jei-238222:6600311")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_credits: mod_credits,
            mod_url: mod_url,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs"            : "${mod_id}.mixins.json"
        ])
    }

    archiveFileName = "${mod_id}-${mod_version}-origin.jar"
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

afterEvaluate {
    tasks.named('build') {
        doLast {
            def newFileName = "${mod_id}-${mod_version}.jar"
            def newJarPath = layout.buildDirectory.file("libs/$newFileName").get().asFile
            newJarPath.parentFile.mkdirs()
            ant.delete(file: file("build/libs/${mod_id}-${mod_version}-origin.jar"))
            ant.move(
                    file: file("build/libs/${mod_id}-${mod_version}-all.jar"),
                    tofile: file("build/libs/${mod_id}-${mod_version}.jar")
            )
        }
    }
}